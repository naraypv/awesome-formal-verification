name: Temporary pinned Quint toolchain materialization

on:
  push:
    branches: [tmp/quint-toolchain-20260910]
    paths:
      - .github/workflows/materialize-quint-toolchain.yml
      - scripts/install-formal-temurin.sh

permissions:
  contents: read

concurrency:
  group: temporary-quint-toolchain-20260910
  cancel-in-progress: true

env:
  QUINT_URL: https://github.com/quint-co/quint/releases/download/v0.32.0/quint-linux-amd64
  QUINT_SHA256: 939b64095b706017f2f202c6f99c860c40be7c31bddc2b98557316e50f42cd7f
  APALACHE_URL: https://github.com/apalache-mc/apalache/releases/download/v0.56.1/apalache.tgz
  APALACHE_SHA256: 91125e5a3646b9c9d3a7d921d3323f321fac5071909f72b3960c66ff2f998ee1
  APALACHE_BYTES: "130948787"

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Shallow read-only checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          submodules: false
          lfs: false
          persist-credentials: false

      - name: Install and authenticate exact Temurin archive
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/quint-toolchain"
          java_home="$RUNNER_TEMP/temurin-21.0.12.1_1"
          mkdir -p "$out"
          scripts/install-formal-temurin.sh "$java_home" 2>&1 \
            | tee "$out/temurin-install.log"
          printf 'JAVA_HOME=%s\n' "$java_home" >> "$GITHUB_ENV"
          printf 'JAVA_HOME_21_X64=%s\n' "$java_home" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$java_home" >> "$GITHUB_PATH"

      - name: Download and authenticate public release assets
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/quint-toolchain"
          mkdir -p "$out"

          curl --proto '=https' --tlsv1.2 --fail --location --show-error \
            --retry 5 --retry-delay 2 --retry-all-errors \
            --connect-timeout 20 --max-time 300 \
            --output "$out/quint-linux-amd64" "$QUINT_URL"
          printf '%s  %s\n' "$QUINT_SHA256" "$out/quint-linux-amd64" \
            | sha256sum --check --strict
          chmod 0555 "$out/quint-linux-amd64"

          curl --proto '=https' --tlsv1.2 --fail --location --show-error \
            --retry 5 --retry-delay 2 --retry-all-errors \
            --connect-timeout 20 --max-time 300 \
            --output "$out/apalache-0.56.1.tgz" "$APALACHE_URL"
          printf '%s  %s\n' "$APALACHE_SHA256" "$out/apalache-0.56.1.tgz" \
            | sha256sum --check --strict
          test "$(stat --format='%s' "$out/apalache-0.56.1.tgz")" \
            = "$APALACHE_BYTES"

          test "$(command -v java)" = "$JAVA_HOME/bin/java"
          "$out/quint-linux-amd64" --version \
            2>&1 | tee "$out/quint-version.log"
          java -XshowSettings:properties -version \
            2>&1 | tee "$out/java-version.log"
          grep -F 'java.vendor = Eclipse Adoptium' "$out/java-version.log"
          grep -F 'java.version = 21.0.12.1' "$out/java-version.log"
          grep -F 'java.runtime.version = 21.0.12.1+1' \
            "$out/java-version.log"

          java_parent="$(dirname -- "$JAVA_HOME")"
          java_name="$(basename -- "$JAVA_HOME")"
          tar --create --gzip \
            --file "$out/temurin-21.0.12.1+1-linux-x64.tar.gz" \
            --directory "$java_parent" "$java_name"

          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "sha=$GITHUB_SHA"
            echo "runner_name=$RUNNER_NAME"
            echo "runner_arch=$RUNNER_ARCH"
            echo "runner_os=$RUNNER_OS"
            echo "java_home_archive_root=$java_name"
            uname -a
            stat --format='%n %s bytes' \
              scripts/install-formal-temurin.sh \
              "$out/quint-linux-amd64" \
              "$out/apalache-0.56.1.tgz" \
              "$out/temurin-21.0.12.1+1-linux-x64.tar.gz"
            sha256sum \
              scripts/install-formal-temurin.sh \
              "$JAVA_HOME/bin/java" \
              "$out/quint-linux-amd64" \
              "$out/apalache-0.56.1.tgz" \
              "$out/temurin-21.0.12.1+1-linux-x64.tar.gz"
          } | tee "$out/manifest.txt"

      - name: Retain authenticated public toolchain for private local execution
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quint-0.32.0-apalache-0.56.1-temurin-21.0.12.1-linux-amd64
          path: ${{ runner.temp }}/quint-toolchain
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
